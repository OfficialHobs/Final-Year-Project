<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Signup</title>
    <link rel="stylesheet" href="signup.css">
    <script defer src="signup.js"></script>
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm" action="register.php" method="POST">
            <label for="full_name">Full Name (in caps)</label>
            <input type="text" id="full_name" name="full_name" required>

            <label for="department">Department</label>
            <input type="text" id="department" name="department" required>

            <label for="faculty">Faculty</label>
            <input type="text" id="faculty" name="faculty" required>

            <label for="matric_number">Matriculation Number</label>
            <input type="number" id="matric_number" name="matric_number" required>

            <label for="dob">Date of Birth (dd/mm/yyyy)</label>
            <input type="date" id="dob" name="dob" maxlength="10" required placeholder="dd/mm/yyyy">

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="student_type">Student Type</label>
            <select id="student_type" name="student_type" required>
                <option value="100level">100 Level</option>
                <option value="200level">200 Level</option>
                <option value="300level">300 Level</option>
                <option value="400level">400 Level</option>
            </select>

            <label for="phone_number">Phone Number</label>
            <input type="number" id="phone_number" name="phone_number" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>

            <label for="email_address">Email Address</label>
            <input type="email" id="email_address" name="email_address" required>

            <label for="guardian_name">Guardian's Name</label>
            <input type="text" id="guardian_name" name="guardian_name" required>

            <label for="guardian_phone_number">Guardian's Phone Number</label>
            <input type="number" id="guardian_phone_number" name="guardian_phone_number" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <div class="checkbox">
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">Agree to submit</label>
            </div>
            <em>Please confirm the above information is correct before you submit!</em>
            <button type="submit">Register</button>

            <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
</body>
</html>
